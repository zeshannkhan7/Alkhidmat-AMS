<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alkhidmat Foundation Islamabad — Track Application</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0d6ebd;--blue-dark:#0a5490;--blue-mid:#1278cc;--gold:#c9a84c;--gold-lt:#e8c97a;--cream:#f5f8fc;--gray:#6b7280;--light:#e0e7ef;--green:#1a6b3c;--green-bg:#d4edda;--amber:#7a4f00;--amber-bg:#fff3cd;--red:#8b1a1a;--red-bg:#fde8e8;--shadow:0 4px 24px rgba(13,110,189,0.13);--shadow-lg:0 8px 48px rgba(13,110,189,0.18);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 100%);border-bottom:4px solid var(--gold);padding:24px 20px 20px;text-align:center;position:relative;}
.logo{width:78px;height:78px;object-fit:contain;border-radius:10px;padding:5px;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto;}
header h1{font-family:'Playfair Display',serif;font-size:1.65rem;color:#fff;letter-spacing:0.03em;}
header p{font-size:0.8rem;color:var(--gold-lt);text-transform:uppercase;letter-spacing:0.14em;font-weight:500;margin-top:4px;}
.admin-link{position:absolute;top:18px;right:20px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);font-size:0.78rem;padding:6px 14px;border-radius:20px;text-decoration:none;font-family:'Source Sans 3',sans-serif;font-weight:600;transition:all 0.18s;}
.admin-link:hover{background:rgba(255,255,255,0.2);color:#fff;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.track-card{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:36px 36px 32px;width:100%;max-width:540px;}
.track-card h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--blue-dark);margin-bottom:6px;}
.track-card .subtitle{font-size:0.88rem;color:var(--gray);margin-bottom:26px;line-height:1.5;}
label{display:block;font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--blue-dark);margin-bottom:7px;}
.prefix-row{display:flex;gap:0;align-items:center;border:2px solid var(--light);border-radius:7px;overflow:hidden;background:#fafcff;transition:border-color 0.2s,box-shadow 0.2s;}
.prefix-row:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,110,189,0.12);}
.prefix-tag{background:var(--blue-dark);color:var(--gold-lt);font-weight:700;padding:12px 14px;font-size:0.9rem;letter-spacing:0.04em;white-space:nowrap;}
.prefix-row input{flex:1;padding:12px 14px;border:none;font-family:'Source Sans 3',sans-serif;font-size:1rem;color:#1a2a3a;background:transparent;outline:none;letter-spacing:0.06em;}
.btn-track{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.18s;margin-top:14px;}
.btn-track:hover{background:var(--blue-dark);box-shadow:0 4px 14px rgba(13,110,189,0.3);}
#result{margin-top:26px;}
.not-found{background:var(--amber-bg);border:1px solid #e6a817;border-radius:8px;padding:16px 18px;color:var(--amber);font-weight:600;font-size:0.92rem;}
.result-card{border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.result-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue-mid));padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.result-diary-label{font-size:0.72rem;color:var(--gold-lt);text-transform:uppercase;letter-spacing:0.12em;font-weight:700;}
.result-diary-num{font-family:'Playfair Display',serif;font-size:1.65rem;color:var(--gold);font-weight:700;letter-spacing:0.06em;}
.badge{display:inline-block;padding:4px 13px;border-radius:50px;font-size:0.74rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.badge-pending{background:var(--amber-bg);color:var(--amber);}
.badge-approved{background:var(--green-bg);color:var(--green);}
.badge-rejected{background:var(--red-bg);color:var(--red);}
.result-body{background:#fff;padding:18px 22px;}
.drow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f4f8;font-size:0.9rem;}
.drow:last-child{border:none;}
.dk{min-width:140px;color:var(--gray);font-weight:700;font-size:0.76rem;text-transform:uppercase;letter-spacing:0.05em;}
.dv{color:#1a2a3a;flex:1;font-weight:500;}
.status-note{margin-top:14px;padding:12px 14px;border-radius:7px;font-size:0.84rem;font-weight:600;}
.status-note.pending{background:var(--amber-bg);color:var(--amber);}
.status-note.approved{background:var(--green-bg);color:var(--green);}
.status-note.rejected{background:var(--red-bg);color:var(--red);}
footer{text-align:center;padding:18px;font-size:0.78rem;color:var(--gray);border-top:1px solid var(--light);background:#fff;}
@media(max-width:500px){.track-card{padding:24px 18px 20px;}header{padding-top:48px;}header h1{font-size:1.25rem;}}
</style>
</head>

<main>
  <div class="track-card">
    <h2>🔍 Track Your Application</h2>
    <p class="subtitle">Enter the <strong>last digits</strong> of your Diary Number to check your application status. The prefix <strong>AKF-2026-</strong> is already filled in.</p>

<script>
const YEAR = new Date().getFullYear();
document.getElementById('prefixTag').textContent = 'AKF-'+YEAR+'-';
function getApps(){return JSON.parse(localStorage.getItem('akf_apps')||'[]');}
function tIcon(t){return{'Marriage Help':'💍','Financial Help':'💰','Educational Help':'🎓','Wheelchair':'♿','Sewing Machine':'🧵','WASH Program':'💧'}[t]||'📄';}
function badgeHTML(s){const c={'Pending':'badge-pending','Approved':'badge-approved','Rejected':'badge-rejected'};return '<span class="badge '+( c[s]||'')+'">'+ s+'</span>';}
function statusNote(s){const msgs={'Pending':'⏳ Your application is currently under review. Please check back later.','Approved':'✅ Congratulations! Your application has been approved. Please contact Alkhidmat Foundation Islamabad for next steps.','Rejected':'❌ We regret to inform you that your application could not be approved at this time. Please visit our office for more information.'};return '<div class="status-note '+s.toLowerCase()+'">'+( msgs[s]||'')+'</div>';}
function trackApp(){
  const digits=document.getElementById('diaryInput').value.trim();
  const result=document.getElementById('result');
  if(!digits){result.innerHTML='<div class="not-found">⚠️ Please enter your diary number digits.</div>';return;}
  const padded=digits.padStart(4,'0');
  const full='AKF-'+YEAR+'-'+padded;
  const apps=getApps();
  const a=apps.find(x=>x.diaryNo&&x.diaryNo.toUpperCase()===full.toUpperCase());
  if(!a){result.innerHTML='<div class="not-found">⚠️ No application found for <strong>'+full+'</strong>. Please check the number and try again, or visit our office.</div>';return;}
  result.innerHTML='<div class="result-card"><div class="result-header"><div><div class="result-diary-label">Diary Number</div><div class="result-diary-num">'+a.diaryNo+'</div></div>'+badgeHTML(a.status)+'</div><div class="result-body"><div class="drow"><div class="dk">Applicant Name</div><div class="dv">'+esc(a.name)+'</div></div><div class="drow"><div class="dk">Purpose</div><div class="dv">'+tIcon(a.type)+' '+esc(a.type)+'</div></div><div class="drow"><div class="dk">Date Received</div><div class="dv">'+esc(a.receivingDate)+'</div></div><div class="drow"><div class="dk">Current Status</div><div class="dv">'+badgeHTML(a.status)+'</div></div>'+(a.status==='Approved'&&a.amount?'<div class="drow"><div class="dk">Amount Approved</div><div class="dv"><strong>Rs. '+esc(a.amount)+'</strong></div></div>':'')+'<div class="drow"><div class="dk">Last Updated</div><div class="dv">'+esc(a.statusDate||'—')+'</div></div>'+(a.remarks?'<div class="drow"><div class="dk">Remarks</div><div class="dv">'+esc(a.remarks)+'</div></div>':'')+statusNote(a.status)+'</div></div>';
}
function esc(v){if(!v)return'—';const d=document.createElement('div');d.appendChild(document.createTextNode(String(v)));return d.innerHTML;}
